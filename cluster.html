<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cluster — Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;650;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/vault.css" />
</head>
<body>
  <script src="js/vault.js"></script>
  <script>
    async function render(root) {
      const [health, nodes] = await Promise.all([
        VaultAPI.get('/api/v1/cluster/health'),
        VaultAPI.get('/api/v1/cluster/nodes'),
      ]);
      root.innerHTML = `
        <div class="grid-4" style="margin-bottom:16px">
          <div class="card"><div class="stat-val">${health.healthScore}%</div><div class="stat-lbl">Score</div></div>
          <div class="card"><div class="stat-val">${health.degradedNodes}</div><div class="stat-lbl">Degraded</div></div>
          <div class="card"><div class="stat-val">${health.offlineNodes}</div><div class="stat-lbl">Offline</div></div>
          <div class="card"><div class="stat-val">${health.totalReplicas}</div><div class="stat-lbl">Replicas on disk</div></div>
        </div>
        <div class="card" style="margin-bottom:14px">
          <h2 style="font-family:var(--font);margin-bottom:8px">Register a storage node</h2>
          <form id="reg" style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end">
            <div class="field"><label>Name</label><input name="nodeName" required placeholder="Node-Epsilon" /></div>
            <div class="field"><label>URL</label><input name="nodeUrl" required placeholder="http://127.0.0.1:9005" /></div>
            <button class="btn btn-primary" type="submit">Register</button>
          </form>
          <p class="sub" style="margin-top:8px">Against a live vault-backend gateway, the node must answer GET /health. The local simulator accepts the registration so the console stays usable.</p>
        </div>
        <div class="node-grid"></div>
      `;
      const grid = root.querySelector('.node-grid');
      grid.innerHTML = nodes.map(n => `
        <article class="node">
          <div style="display:flex;justify-content:space-between">
            <h3>${n.node_name}</h3>
            ${statusBadge(n.status)}
          </div>
          <p class="sub">${n.endpoint_url}</p>
          <div class="meter"><i style="width:${n.capacity.usedPercent}%"></i></div>
          <p>${fmtBytes(n.capacity.used)} / ${fmtBytes(n.capacity.total)}</p>
          <p class="sub">${n.stored_replicas_count} replicas · heartbeat ${Math.round((n.time_since_heartbeat_ms||0)/1000)}s ago</p>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" data-inspect="${n.id}">Inspect chunks</button>
            ${n.status !== 'OFFLINE' ? `<button class="btn btn-danger btn-sm" data-off="${n.id}">Decommission</button>` : ''}
          </div>
          <div class="mono" id="chunks-${n.id}" style="margin-top:8px"></div>
        </article>
      `).join('');

      root.querySelector('#reg').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          await VaultAPI.send('/api/v1/cluster/nodes', 'POST', {
            nodeName: fd.get('nodeName'),
            nodeUrl: fd.get('nodeUrl'),
          });
          toast('Node registered');
          render(root);
        } catch (ex) { toast(ex.message); }
      };
      root.querySelectorAll('[data-off]').forEach(btn => btn.onclick = async () => {
        if (!confirm('Mark this node OFFLINE and let the healer rebuild missing replicas?')) return;
        await VaultAPI.send('/api/v1/cluster/nodes/' + btn.dataset.off, 'DELETE');
        toast('Node marked offline');
        render(root);
      });
      root.querySelectorAll('[data-inspect]').forEach(btn => btn.onclick = async () => {
        const detail = await VaultAPI.get('/api/v1/cluster/nodes/' + btn.dataset.inspect);
        const box = document.getElementById('chunks-' + btn.dataset.inspect);
        box.textContent = (detail.stored_chunks || []).slice(0, 8).map(c =>
          `${c.filename}#${c.chunk_index}${c.is_corrupted ? ' corrupt' : ''}`
        ).join('\n') || 'No chunks on this node.';
      });
    }

    (async () => {
      const root = await VaultShell.mount('cluster');
      if (!root) return;
      VaultShell.setHeading('Cluster nodes', 'Independent storage processes, heartbeats, capacity, and replica counts.');
      await render(root);
    })().catch((e) => { document.body.textContent = e.message; });
  </script>
</body>
</html>
