<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Durability — Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;650;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/vault.css" />
</head>
<body>
  <script src="js/vault.js"></script>
  <script>
    (async () => {
      const root = await VaultShell.mount('durability');
      if (!root) return;
      VaultShell.setHeading('Durability policy', 'How many copies, how many writes must land before a put is acknowledged, and how often to scrub.');
      const s = await VaultAPI.get('/api/v1/cluster/settings');
      root.innerHTML = `
        <form class="card" id="policy" style="max-width:560px;display:flex;flex-direction:column;gap:14px">
          <div class="field">
            <label for="replicationFactor">Default replication factor</label>
            <input id="replicationFactor" type="number" min="1" max="9" value="${s.replicationFactor}" />
          </div>
          <div class="field">
            <label for="minDurableWrites">Minimum durable writes (ack quorum)</label>
            <input id="minDurableWrites" type="number" min="1" max="9" value="${s.minDurableWrites}" />
          </div>
          <div class="field">
            <label for="scrubIntervalMinutes">Integrity scrub interval (minutes)</label>
            <input id="scrubIntervalMinutes" type="number" min="1" value="${s.scrubIntervalMinutes}" />
          </div>
          <button class="btn btn-primary" type="submit">Save policy</button>
        </form>
        <p class="sub" style="margin-top:14px;max-width:60ch">
          vault-backend applies replication per upload (<code>replicationFactor</code> form field) and runs healer/scrubber daemons.
          This console persists the operator defaults. There is no sharing, API-key, or lifecycle-tier UI — those were unused.
        </p>
      `;
      document.getElementById('policy').onsubmit = async (e) => {
        e.preventDefault();
        const body = {
          replicationFactor: document.getElementById('replicationFactor').value,
          minDurableWrites: document.getElementById('minDurableWrites').value,
          scrubIntervalMinutes: document.getElementById('scrubIntervalMinutes').value,
        };
        await VaultAPI.send('/api/v1/cluster/settings', 'PUT', body);
        toast('Durability policy saved');
      };
    })().catch((e) => { document.body.textContent = e.message; });
  </script>
</body>
</html>
